name: Candidate skill archive
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Candidate package version; does not create a tag or release'
        required: true
        default: '0.1.0'
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build candidate archive
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: python3 -B tools/package_skill.py --skill-root skills/codex-md-improver --out-dir "$RUNNER_TEMP/codex-md-package" --version "$PACKAGE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: codex-md-improver-candidate
          path: ${{ runner.temp }}/codex-md-package/
          if-no-files-found: error
